<title>싹이의 생명 정원</title>
<!--
=====================================================================
  싹이의 생명 정원 — 3학년 2학기 도덕 7. 생명을 소중히 여기는 우리 (3차시 · 생명 존중 전시회 계획하기)
  교사가 직접 설계한 수업용 웹 도구. 인터넷 없이 더블클릭으로 실행되는 HTML 파일 하나입니다.
  (바깥 주소를 부르지 않고, 학생 로그인·서버 없음. 글꼴은 파일 안에 넣어 둠)

  [수업 흐름 — 40분]
   도입 5분   전자칠판으로 시작 화면 보기, 학습 문제 확인
   개인 10분  '내 씨앗 심기' — 각자 태블릿으로 씨앗 고르기 → 알리고 싶은 행동 한 문장 → 소중한 까닭 → 내 씨앗 카드
   모둠 13분  '우리 모둠 정원' — 모두 말하고 함께 정해요(대표는 입력해요). 씨앗 심기 → 계획 세우기
   점검 7분   '물 주기' — ①누구에게 어떻게 도움이 되나 ②친구 의견을 듣고 고친 점/그대로 하는 까닭 ③함께할 사람·준비물·곳
              끝나면 대표가 초대장 화면을 캡처해 패들렛 모둠 칸에 올림
   정리 5분   두 모둠 발표(모둠당 30초 안팎) → 각자 '오늘의 한 줄 생각' 한 칸 쓰기(교사 순회 확인)

  [교육 내용]
   · 누구의 생명을, 왜 소중히 여기는지 · 전시회로 어떤 행동이 달라지기를 바라는지(구체적인 존중 행동)
   · 상대에게 정말 도움이 되는 행동인지, 친구 의견을 듣고 고칠지 그대로 할지 · 실제로 할 수 있는 계획인지
   전시 방법은 모둠마다 달라도 괜찮습니다. 다만 '생명을 소중히 여기는 마음이 상대에게 도움이 되는 행동으로 드러나는가'는 모두 함께 살핍니다.
   앱은 옳고 그름을 판정하지 않고 학생의 대화를 돕습니다. 칸을 채우면 넘어가는 단순 확인 절차가 아닙니다.

  [교사용]
   · 왼쪽 위 '싹이의 생명 정원' 글자를 빠르게 5번 누르면 교사용 창이 열립니다(장면 이동, 예시로 채우기, 새로 시작).
   · 소리는 기본이 꺼짐입니다(교실이 소란스러워지는 것을 막기 위해). 필요하면 오른쪽 위에서 켭니다.
   · (저장 키 ssak-garden-v4: 이전 버전의 연습 기록은 읽지 않습니다)
   · 주소 끝 #scene=장면이름 (start a1 a2 a3 b0 b1 b2 b3 b4 r1), #demo=1 로 예시 내용을 채워 미리 볼 수 있습니다.

:root{
  --ink:#5A3E2B; --cream:#FFF9E8; --grid:#EFE4C6; --green:#8FD65F; --green-d:#3E9B4A; --leaf:#5FC24E;
  --sky:#CDEBFF; --sky-d:#79BDF0; --sun:#FFD84D; --coral:#FF8F7C; --pink:#FFB3C7; --lav:#DCCBFF; --soil:#9A6A44;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#BFE3A6;overflow:hidden;color:var(--ink);
  font-family:'Gaegu','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-weight:700;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;word-break:keep-all}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;margin:-400px 0 0 -640px;transform-origin:50% 50%;
  overflow:hidden;background-color:var(--cream);
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);
  background-size:40px 40px;box-shadow:0 0 0 10px #8CC66E, 0 0 40px rgba(0,0,0,.18)}
.top{position:absolute;left:0;right:0;top:0;height:78px;display:flex;align-items:center;gap:14px;padding:0 22px;z-index:5}
.logo{font-size:32px;white-space:nowrap;line-height:1;background:var(--green);border:5px solid var(--ink);border-radius:18px 18px 18px 6px;
  padding:6px 20px 8px;box-shadow:0 5px 0 var(--ink);transform:rotate(-1.5deg);cursor:default}
.steps{display:flex;gap:8px;margin-left:8px;flex:1}
.stp{font-size:22px;line-height:1;white-space:nowrap;padding:8px 14px 9px;border:4px dashed #C9B58F;border-radius:999px;color:#A08A66;background:rgba(255,255,255,.55)}
.stp.cur{border:4px solid var(--ink);background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.stp.done{border:4px solid var(--green-d);background:#E6F8D4;color:var(--green-d)}
.tbtn{font-size:22px;line-height:1;white-space:nowrap;padding:8px 14px 9px;border:4px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;color:var(--ink)}
.tbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#sc{position:absolute;left:0;right:0;top:78px;bottom:0}
.sc{position:absolute;left:0;right:0;top:0;bottom:0}
.sc.enter{animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 버튼 */
.btn{font:700 36px/1 'Gaegu','Malgun Gothic',sans-serif;color:var(--ink);padding:14px 36px 16px;border:5px solid var(--ink);border-radius:999px;
  background:var(--sun);box-shadow:0 8px 0 var(--ink);cursor:pointer;position:relative;top:0;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.btn.green{background:var(--green)} .btn.sky{background:var(--sky)} .btn.coral{background:var(--coral)} .btn.white{background:#fff}
.btn.sm{font-size:28px;padding:9px 24px 11px;box-shadow:0 6px 0 var(--ink)}
.btn:disabled{opacity:.45;box-shadow:0 3px 0 var(--ink);cursor:default}
.btn small{display:block;font-size:24px;font-weight:400;margin-top:6px}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{font:700 28px/1.1 'Gaegu','Malgun Gothic',sans-serif;color:var(--ink);background:#fff;border:4px solid var(--ink);border-radius:20px;
  padding:9px 20px 11px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.chip:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.chip.on{background:var(--green);padding-left:48px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 13 L10 19 L21 6' fill='none' stroke='%235A3E2B' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-size:26px 26px;background-position:14px 50%}
.chip.sq{min-width:78px;text-align:center;padding-left:20px!important;background-image:none!important}
.field{margin-bottom:20px}
.big .field{margin-bottom:34px}.big .chip{font-size:33px;padding:11px 26px 13px}.big .chip.on{padding-left:52px}.big .lab{font-size:36px}.big .lab span{font-size:26px}.big .inp{font-size:33px;padding:12px 20px 14px}.big .h2{margin-bottom:26px}
.lab{font-size:30px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.lab i{font-style:normal;background:var(--sky);border:3px solid var(--ink);border-radius:50%;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;font-size:26px}
.lab span{font-weight:400;font-size:24px;color:#8A6D55}
.inp{font:700 30px 'Gaegu','Malgun Gothic',sans-serif;color:var(--ink);width:100%;padding:8px 18px 10px;border:4px solid var(--ink);border-radius:16px;background:#fff;outline:none}
.inp:focus{border-color:var(--green-d);box-shadow:0 0 0 5px rgba(143,214,95,.45)}
.inp::placeholder{color:#B9A58A;font-weight:400}

/* 말풍선 */
.bubble{position:relative;background:#fff;border:5px solid var(--ink);border-radius:30px;padding:16px 24px 18px;font-size:32px;line-height:1.25;box-shadow:0 6px 0 rgba(90,62,43,.25)}
.bubble.tl::after{content:"";position:absolute;left:46px;bottom:-26px;width:34px;height:34px;background:#fff;border-right:5px solid var(--ink);border-bottom:5px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg)}
.bubble.tr::after{content:"";position:absolute;right:46px;bottom:-26px;width:34px;height:34px;background:#fff;border-right:5px solid var(--ink);border-bottom:5px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg)}
.bubble.left::after{content:"";position:absolute;left:-23px;top:36px;width:34px;height:34px;background:#fff;border-left:5px solid var(--ink);border-bottom:5px solid var(--ink);transform:rotate(45deg)}
.bubble b{color:var(--green-d)}
.warn{background:#FFF1D6}.warn.left::after,.warn.tl::after{background:#FFF1D6}
.good{background:#E6F8D4}.good.left::after,.good.tl::after{background:#E6F8D4}

/* 장면 공통 */
.pad{padding:12px 28px 0}
.h2{font-size:46px;line-height:1.1;margin:0 0 8px}
.h2 em{font-style:normal;background:linear-gradient(transparent 58%,#FFE27A 58%);padding:0 6px}
.row{display:flex;gap:18px;align-items:center}
.foot{position:absolute;left:28px;right:28px;bottom:18px;display:flex;align-items:center;gap:16px;justify-content:flex-end}
.foot .msg{flex:1;font-size:26px;color:#8A6D55;font-weight:400}
.foot .msg b{color:var(--coral)}

/* 시작 */
.start-title{position:absolute;left:0;right:0;top:6px;text-align:center}
.start-title h1{margin:0;font-size:112px;line-height:1;letter-spacing:2px;color:var(--ink);text-shadow:5px 5px 0 #fff, 8px 8px 0 var(--green)}
.start-title p{margin:10px 0 0;font-size:30px;color:#8A6D55;font-weight:400}
.start-btns{position:absolute;right:46px;top:300px;width:560px;display:flex;flex-direction:column;gap:26px}
.start-btns .btn{text-align:center;padding:14px 30px 16px;font-size:44px}

/* 카드 */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:0 36px}
.tcard{background:#fff;border:5px solid var(--ink);border-radius:26px;padding:12px 14px 14px;text-align:center;cursor:pointer;
  box-shadow:0 8px 0 var(--ink);transition:transform .12s,box-shadow .12s;position:relative;touch-action:none}
.tcard:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.tcard.on{background:#EAFBD6;border-color:var(--green-d);box-shadow:0 8px 0 var(--green-d)}
.tcard.on::after{content:"";position:absolute;right:12px;top:10px;width:46px;height:46px;border-radius:50%;background:var(--green) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5 L10 17.5 L19 7' fill='none' stroke='%235A3E2B' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/30px no-repeat;border:4px solid var(--ink)}
.tcard svg{width:104px;height:104px;display:block;margin:0 auto}
.tcard .nm{font-size:36px;line-height:1.1;margin-top:2px}
.tcard .ds{font-size:25px;line-height:1.15;font-weight:400;color:#7A5E47;margin-top:6px;min-height:58px}
.tray{position:absolute;left:0;right:0;bottom:12px;display:flex;gap:14px;justify-content:center;padding:0 16px}
.tray .tcard{width:196px;padding:8px 8px 10px}
.tray .tcard svg{width:78px;height:78px}
.tray .tcard .nm{font-size:24px;white-space:nowrap}
.tray .tcard.used{opacity:.35;pointer-events:none}
.ghost{position:absolute;z-index:50;pointer-events:none;transform:rotate(-4deg) scale(1.08);box-shadow:0 18px 0 rgba(90,62,43,.25)}

/* 정원 SVG */
.garden{display:block}
.garden .stg{transform-origin:0 0}
.garden.grow .stg{animation:pop .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(.1)}100%{transform:scale(1)}}
.garden .sway{transform-origin:0 0;animation:sway 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.garden .bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.garden .canb{transform-origin:236px 218px;transition:transform .5s ease}
.garden.pour .canb{transform:rotate(28deg)}
.garden .dr{opacity:0}
.garden.pour .dr .dxg{animation:dx .8s linear infinite}
.garden.pour .dr circle{animation:dy .8s cubic-bezier(.5,0,1,.8) infinite}
.garden.pour .dr{opacity:1}

.packet::before{content:"";position:absolute;left:-6px;right:-6px;top:-6px;height:64px;background:var(--leaf);border:6px solid var(--ink);border-radius:20px 20px 0 0;
  clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}

.say{background:#FFF1D6;border:4px dashed var(--ink);border-radius:20px;padding:10px 18px 12px;font-size:25px;line-height:1.25;font-weight:400;user-select:text;-webkit-user-select:text}
.say b{font-weight:700}

<script>
'use strict';

const ro=w=>{const c=String(w).trim().slice(-1).charCodeAt(0);if(c<0xAC00||c>0xD7A3)return '로';const b=(c-0xAC00)%28;return (b===0||b===8)?'로':'으로'};

  ind:{card:null,custom:'',targets:[],reasons:[],act:'',refType:'',ref1:''},
  grp:{no:null,card:null,custom:'',title:'',targets:[],act:'',reasons:[],text:'',help:'',fbMode:null,fbFix:'',fbKeep:'',with:[],items:[],place:[],water:0,q:0,qdone:[false,false,false],sig:'',sigCard:'',scene:'b0'}});
let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);S=Object.assign(fresh(),o);S.ind=Object.assign(fresh().ind,o.ind||{});S.grp=Object.assign(fresh().grp,o.grp||{});}}catch(e){}

function warnSave(){let w=document.getElementById('savewarn');if(!saveFail){if(w)w.remove();return}
  if(!w){w=document.createElement('div');w.id='savewarn';w.textContent='이 태블릿에서는 저장이 되지 않아요. 새로고침하거나 창을 닫으면 쓴 내용이 사라질 수 있어요.';document.getElementById('stage').appendChild(w)}}

/* ---------- 소리(기본 꺼짐) ---------- */
let AC=null;
function tone(f,d=.14,type='sine',v=.12,delay=0){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05);}catch(e){}
}
const sfx={pick(){tone(660,.1,'triangle')},plant(){tone(330,.12,'sine');tone(440,.16,'sine',.12,.1)},
  drip(){for(let i=0;i<5;i++)tone(900-i*60,.07,'sine',.08,i*.14)},grow(){[523,659,784].forEach((f,i)=>tone(f,.2,'triangle',.12,i*.1))},

const ic={

 campaign:`<svg viewBox="0 0 120 120"><g filter="url(#wob)" stroke="#5A3E2B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M30 48 L82 24 L82 92 L30 68Z" fill="#FF8F7C"/><rect x="14" y="46" width="20" height="24" rx="6" fill="#FFD84D"/><path d="M40 70 L46 96 L60 96 L56 78" fill="#CDEBFF"/><path d="M92 40 Q102 58 92 76 M100 30 Q116 58 100 86" fill="none"/></g></svg>`,

 idea:`<svg viewBox="0 0 120 120"><g filter="url(#wob)" stroke="#5A3E2B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M60 14 C36 14 26 36 36 54 C42 64 44 68 44 78 L76 78 C76 68 78 64 84 54 C94 36 84 14 60 14Z" fill="#FFD84D"/><rect x="44" y="82" width="32" height="10" rx="4" fill="#B98254"/><path d="M52 98 H68" fill="none"/><path d="M60 8 V2 M96 22 L102 16 M24 22 L18 16 M104 50 H112 M8 50 H16" fill="none"/></g></svg>`
};
const CARDS=[
 {id:'sign',name:'팻말 만들기',ds:'생명을 소중히 여기는 말을 팻말에 써요'},

];
const cardOf=id=>CARDS.find(c=>c.id===id);
const icon=c=>ic[c.ico||c.id];
const cardName=(id,custom)=>{const c=cardOf(id);if(!c)return '';return (id==='idea'&&custom)?custom.trim():c.name};
const TARGETS=['사람','동물','식물','우리 모두'];
const REASONS=[
 {id:'r1',label:'생명은 하나뿐이에요',clause:'생명은 하나뿐이기 때문이에요'},
 {id:'r2',label:'정성과 노력으로 태어났어요',clause:'정성과 노력으로 태어난 소중한 존재이기 때문이에요'},
 {id:'r3',label:'한번 잃으면 되돌릴 수 없어요',clause:'한번 잃으면 되돌릴 수 없기 때문이에요'},
 {id:'r4',label:'우리와 함께 살아가요',clause:'우리와 함께 살아가는 존재이기 때문이에요'}];
const tgPhrase=(arr)=>arr.includes('우리 모두')?'모든 생명을':arr.join(', ')+'의 생명을';

const whyText=(ids,free)=>{const cl=ids.map(id=>REASONS.find(r=>r.id===id).clause);let t='';
  if(cl.length)t='왜냐하면 '+cl[0]+'.'+cl.slice(1).map(c=>' 또 '+c+'.').join('');

const MINLEN=2; // 점검 입력 최소 글자 수(길이만 보며, 내용의 알맞음은 판단하지 않음)

function sprout(expr){

}
function plantSVG(stage,label){
  // 원점(0,0) = 화분 가장자리 가운데

 b4(){

       <input class="inp" data-model="ind.ref1" maxlength="50" placeholder="${i.refType==='act'?'예) 길에서 개미를 보면 밟지 않고 피해 가요':i.refType==='learn'?'예) 친구 이야기를 들으니 다른 방법도 있다는 걸 알았어요':'위에서 하나를 먼저 골라요'}" value="${esc(i.ref1)}"></div>

function chip(path,val,label,dis){const arr=get(path);return `<button class="chip${arr.includes(val)?' on':''}" data-act="tog" data-p="${path}" data-v="${esc(val)}"${dis?' disabled':''}>${esc(label)}</button>`}
function sentence(){
  const g=S.grp,name=cardName(g.card,g.custom);
  const t=g.title.trim(), eul=hasB(t)?'을':'를';
  const why=whyText(g.reasons,g.text);
  return `${g.no}모둠은 「${t}」${eul} 열기로 했어요. ${name}${ro(name)} ${actQ(g.act)}라고 알려서 ${tgPhrase(g.targets)} 소중히 여기는 마음을 전할 거예요.${why?' '+why:''}`;
}
function get(path){const [a,b]=path.split('.');return S[a][b]}
function setv(path,v){const [a,b]=path.split('.');S[a][b]=v}

/* ---------- 화면 제어 ---------- */
function stepsFor(scene){
  if(['a1','a2','a3'].includes(scene)){const i=+scene[1]-1;return STEPS.ind.map((t,k)=>`<div class="stp ${k===i?'cur':k<i?'done':''}">${k+1} ${t}</div>`).join('')}
  if(['b1','b2','b3','b4'].includes(scene)){const i=+scene[1]-1;return STEPS.grp.map((t,k)=>`<div class="stp ${k===i?'cur':k<i?'done':''}">${k+1} ${t}</div>`).join('')}
  return '';
}
let invOnly=false,invNormal=false;
const GRP_SCENES=['b1','b2','b3','b4'], RBACK_OK=['a3','b4'];
function go(scene,keepHint){
  if(!keepHint)hint=null;
  if(typeof scene!=='string'||!SCENES[scene])scene=S.ind&&S.ind.card?'a3':'start';   // 없는 화면으로는 가지 않음
  if(scene==='b4'){scene=gateB4()}
  if(scene==='b4')growNow=true;
  if(scene!=='b4'){invOnly=false;invNormal=false}
  if(scene==='b3')applyRecheck();
  if(scene==='r1'){hint=null;if(S.scene!=='r1')S.rback=RBACK_OK.includes(S.scene)?S.scene:(S.ind.card?'a3':'start')}
  S.scene=scene;if(scene[0]==='b'&&scene!=='b0')S.grp.scene=scene;save();render();
}
/* 계획의 핵심(방법·대상·알리고 싶은 행동)이 바뀌면 필요한 점검만 다시 한다. 이름·까닭 고치기는 영향 없음 */
/* 꽃 피우기(초대장) 직전: 모둠 계획의 필수 항목과 점검 입력이 모두 있는지 확인. 내용의 옳고 그름은 판단하지 않음 */
function gateB4(){
  const g=S.grp;
  if(missB2().length){hint=null;return 'b2'}
  const hadH=hint; hint=null;
  applyRecheck();                      // 방법·대상·행동이 점검 당시와 다르면 해당 점검을 다시 하게 함
  if(hint&&!g.qdone.every(Boolean)){recalc();return 'b3'}
  hint=hadH;
  const bad=[0,1,2].filter(i=>!g.qdone[i]||!validQ(i));
  if(!bad.length)return 'b4';
  bad.forEach(i=>g.qdone[i]=false);recalc();g.q=bad[0];
  hint=hadH||('빠진 내용이 있어서 <b>'+bad.map(i=>i+1).join('·')+'번 점검</b>을 해야 해요.');return 'b3';
}
/* 저장된 상태를 불러올 때: 형식이 이상해도 멈추지 않고, 완료 표시와 입력이 모순되면 완료를 해제 */
function sanitize(){
  try{
    const g=S.grp,i0=S.ind;
    ['targets','reasons','with','items','place'].forEach(k=>{if(!Array.isArray(g[k]))g[k]=[]});
    ['targets','reasons'].forEach(k=>{if(!Array.isArray(i0[k]))i0[k]=[]});
    ['title','custom','act','text','help','fbFix','fbKeep','sig','sigCard'].forEach(k=>{if(typeof g[k]!=='string')g[k]=''});
    ['custom','act','refType','ref1'].forEach(k=>{if(typeof i0[k]!=='string')i0[k]=''});
    g.targets=g.targets.filter(x=>TARGETS.includes(x));i0.targets=i0.targets.filter(x=>TARGETS.includes(x));
    const rid=REASONS.map(r=>r.id);g.reasons=g.reasons.filter(x=>rid.includes(x));i0.reasons=i0.reasons.filter(x=>rid.includes(x));
    ['with','items','place'].forEach(k=>{g[k]=g[k].filter(x=>typeof x==='string')});
    if(!Array.isArray(g.qdone)||g.qdone.length!==3)g.qdone=[false,false,false];
    g.qdone=g.qdone.map(x=>x===true);   // true만 완료로 인정
    if(g.fbMode!=='fix'&&g.fbMode!=='keep')g.fbMode=null;
    g.q=[0,1,2].includes(g.q)?g.q:0;
    if(g.scene!=null&&!GRP_SCENES.includes(g.scene))g.scene='';
    if(S.rback!=null&&!RBACK_OK.includes(S.rback))S.rback='';
    if(typeof g.sig!=='string')g.sig='';
    if(!(g.no>=1&&g.no<=6))g.no=null;
    if(g.card&&!cardOf(g.card))g.card=null;
    if(i0.card&&!cardOf(i0.card))i0.card=null;
    for(let i=0;i<3;i++)if(g.qdone[i]&&!validQ(i))g.qdone[i]=false;
    recalc();
    if(g.sig&&g.qdone.some(Boolean)&&g.card)applyRecheck();   // 화면과 무관하게 점검 당시 서명과 비교
    if(!SCENES[S.scene])S.scene='start';
    if(['b1','b2','b3','b4'].includes(S.scene)&&!g.no)S.scene='b0';
    else if(['b2','b3','b4'].includes(S.scene)&&!g.card)S.scene='b1';
    else if(S.scene==='b4')S.scene=gateB4();
    if(S.scene==='r1'&&!RBACK_OK.includes(S.rback))S.rback=S.ind.card?'a3':'start';
    if(['a2','a3'].includes(S.scene)&&!i0.card)S.scene='a1';
  }catch(e){S=fresh()}
}
function applyRecheck(){
  const g=S.grp,sig=sigOf();
  if(g.sig&&g.sig!==sig&&g.qdone.some(Boolean)){
    cancelWater();
    const cardChanged=g.sigCard!==methodOf(), again=[];
    if(g.qdone[0]){g.qdone[0]=false;again.push('1')}
    if(g.qdone[1]){g.qdone[1]=false;again.push('2')}
    if(cardChanged&&g.qdone[2]){g.qdone[2]=false;again.push('3')}
    recalc();g.q=Math.max(0,g.qdone.indexOf(false));
    if(again.length)hint='계획이 달라졌어요. <b>'+again.join('·')+'번 점검</b>을 다시 해요. 전에 쓴 말도 지금 계획에 맞는지 다시 읽어요.';
  }
  g.sig=sig;g.sigCard=methodOf();
}
function render(){
  const changed=lastScene!==S.scene;
  $('#sc').innerHTML=SCENES[S.scene]();
  if(changed){const f=$('#sc>.sc');if(f)f.classList.add('enter');}
  $('#steps').innerHTML=stepsFor(S.scene);
  $('#snd').textContent=S.sound?'소리 켜짐':'소리 꺼짐';
  document.body.classList.toggle('low',!!S.low);
  if(S.scene==='b4'){fitInvite();if(changed)sfx.bloom();
    const iv=$('#inv');if(iv&&iv.dataset.fit&&iv.dataset.fit.indexOf('over')===0&&!invOnly&&!invNormal){invOnly=true;render();return}}
  lastScene=S.scene;growNow=false;
}
/* 긴 글이 들어와도 초대장이 잘리지 않게 글자 크기를 단계적으로 줄임 */
function fitInvite(){
  const col=$('#rcol'),inv=$('#inv');if(!col||!inv)return;const dl=inv.querySelector('dl'),h3=inv.querySelector('h3'),say=$('#say');
  const sc=lastScale||1, lim=()=>($('#stage').getBoundingClientRect().top+(800-14)*sc);
  const over=()=>col.getBoundingClientRect().bottom>lim();
  const setFs=(fs,h)=>{dl.style.fontSize=fs+'px';dl.querySelectorAll('dt').forEach(d=>d.style.fontSize=Math.max(20,fs-1)+'px');h3.style.fontSize=h+'px';if(say)say.style.fontSize=Math.max(20,fs-2)+'px'};
  let fs=27,h=46;
  for(let i=0;i<8&&over();i++){fs=Math.max(22,fs-1);h=Math.max(34,h-2);setFs(fs,h)}
  if(over()&&say){say.dataset.collapsed='1';say.innerHTML='<b>글 복사하기</b>를 누르면 패들렛에 올릴 글을 복사해요. (내용이 길어 화면에는 줄였어요)'}
  for(let i=0;i<6&&over();i++){fs=Math.max(20,fs-1);setFs(fs,Math.max(30,h));}
  inv.dataset.fit=(over()?'over':'ok')+':'+fs;
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#layer').appendChild(d);setTimeout(()=>d.remove(),2200)}

/* 물 주기 */
let waterTok=0,waterTimer=null;
function cancelWater(){waterTok++;clearTimeout(waterTimer);pouring=false}
function doWater(){
  if(pouring)return;
  const q=S.grp.q,tok=++waterTok;       // 물 주기를 시작한 질문 번호를 고정
  pouring=true;hint=null;render();sfx.drip();
  waterTimer=setTimeout(()=>{
    if(tok!==waterTok)return;           // 초기화·계획 변경·이동으로 취소된 작업은 기록하지 않음
    pouring=false;
    if(validQ(q)){S.grp.qdone[q]=true;recalc();if(!S.grp.sig){S.grp.sig=sigOf();S.grp.sigCard=methodOf()}save();growNow=true;render();sfx.grow()}
    else{hint='빠진 내용이 있어요. 다시 확인해 주세요.';render()}
  },1500);
}
function hintNow(msg){hint=msg;sfx.oops();render()}

/* 씨앗 끌어다 놓기(또는 누르기) */
let drag=null;
function plant(id){if(pouring)return;
  S.grp.card=id;save();sfx.plant();growNow=true;render();
}
function startDrag(e,el){
  if(e.button>0)return;
  const st=$('#stage'),sr=st.getBoundingClientRect(),scale=sr.width/1280;
  const r=el.getBoundingClientRect();
  drag={el,id:el.dataset.id,sx:e.clientX,sy:e.clientY,moved:false,ox:e.clientX-r.left,oy:e.clientY-r.top,scale,sr,w:r.width/scale,h:r.height/scale,ghost:null};
  try{el.setPointerCapture(e.pointerId)}catch(_){ }
}
function moveDrag(e){
  if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(dx,dy)>10){drag.moved=true;const g=drag.el.cloneNode(true);g.classList.add('ghost');g.style.width=drag.w+'px';g.removeAttribute('data-act');$('#stage').appendChild(g);drag.ghost=g;drag.el.style.opacity='.4'}
  if(drag.ghost){drag.ghost.style.left=((e.clientX-drag.sr.left)/drag.scale-drag.ox/drag.scale)+'px';drag.ghost.style.top=((e.clientY-drag.sr.top)/drag.scale-drag.oy/drag.scale)+'px'}
}
function endDrag(e){
  if(!drag)return;const d=drag;drag=null;
  if(d.ghost)d.ghost.remove();d.el.style.opacity='';
  if(!d.moved){plant(d.id);return}
  const pot=$('#pothit');if(!pot)return;const pr=pot.getBoundingClientRect();
  const pad=40;if(e.clientX>=pr.left-pad&&e.clientX<=pr.right+pad&&e.clientY>=pr.top-pad&&e.clientY<=pr.bottom+pad)plant(d.id);
}

/* ---------- 이벤트 ---------- */
document.addEventListener('pointerdown',e=>{const t=e.target.closest('#tray .tcard');if(t&&!t.classList.contains('used'))startDrag(e,t)});
document.addEventListener('pointermove',moveDrag);
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',()=>{if(drag){if(drag.ghost)drag.ghost.remove();drag.el.style.opacity='';drag=null}});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  const a=t.dataset.act;
  if(t.dataset.sure&&!t.dataset.armed){t.dataset.armed='1';t.dataset.label=t.textContent;t.textContent=t.dataset.sure;setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent=t.dataset.label}},3000);return}
  if(pouring){ // 물 주는 동안에는 화면 이동·선택 변경을 막고, 교사용 초기화 등은 대기 작업을 취소
    if(a.startsWith('t-')){cancelWater()}
    else if(['go','gogrp','qgo','qreopen','qnext','fbmode','tog','pick','gno','copy','copyref','reft'].includes(a))return;
  }
  if(t.closest('#tray')&&a==='plant')return;                 // 트레이는 pointer 이벤트로 처리
  if(a==='go'){go(t.dataset.to)}
  else if(a==='gogrp'){go(S.grp.no?(GRP_SCENES.includes(S.grp.scene)?S.grp.scene:'b1'):'b0')}
  else if(a==='pick'){S.ind.card=t.dataset.id;save();sfx.pick();render()}
  else if(a==='gno'){S.grp.no=+t.dataset.n;save();sfx.pick();render()}
  else if(a==='tog'){const arr=get(t.dataset.p),v=t.dataset.v,i=arr.indexOf(v);if(i<0)arr.push(v);else arr.splice(i,1);if(/^grp\.(with|items|place)$/.test(t.dataset.p)&&S.grp.qdone[2]&&!validQ(2)){S.grp.qdone[2]=false;recalc()}save();sfx.pick();keepInputs(()=>render())}
  else if(a==='q0go'){if(validQ(0))doWater();else hintNow('그 생명에게 어떻게 도움이 되는지 <b>짧게</b> 써 볼까요?')}
  else if(a==='fbmode'){S.grp.fbMode=t.dataset.m;save();sfx.pick();hint=null;render()}
  else if(a==='q1go'){const g=S.grp;const tx=g.fbMode==='fix'?g.fbFix:g.fbMode==='keep'?g.fbKeep:'';
    if(!g.fbMode)hintNow('친구 의견을 듣고 <b>고쳤는지, 그대로 하는지</b> 먼저 골라요.');
    else if(!validQ(1))hintNow(g.fbMode==='fix'?'무엇을 고쳤는지 짧게 써 볼까요?':'그대로 하기로 한 <b>까닭</b>을 짧게 써 볼까요?');
    else doWater()}
  else if(a==='q2go'){const g=S.grp;if(validQ(2))doWater();else hintNow('<b>함께할 사람, 준비물, 전시할 곳</b>을 하나씩 골라 주세요.')}
  else if(a==='qgo'){hint=null;S.grp.q=+t.dataset.q;save();render()}
  else if(a==='qreopen'){S.grp.qdone[S.grp.q]=false;recalc();save();hint=null;render()}
  else if(a==='qnext'){hint=null;const g=S.grp;
    if(g.qdone.every(Boolean)){const bad=[0,1,2].filter(i=>!validQ(i));
      if(bad.length){bad.forEach(i=>g.qdone[i]=false);recalc();g.q=bad[0];hint='빠진 내용이 있어서 <b>'+bad.map(i=>i+1).join('·')+'번 점검</b>을 다시 해요.';save();render()}
      else go('b4')}else{let n=g.qdone.findIndex((d,i)=>!d&&i>g.q);if(n<0)n=g.qdone.indexOf(false);g.q=n;save();render()}}
  else if(a==='invbig'){invOnly=true;render()}
  else if(a==='invback'){invOnly=false;invNormal=true;render()}
  else if(a==='reft'){S.ind.refType=t.dataset.v;save();sfx.pick();render()}
  else if(a==='copyref'){copyText((S.ind.refType==='act'?'[내가 실천할 행동] ':'[친구에게 새로 배운 점] ')+S.ind.ref1.trim(),'ref')}
  else if(a==='copy'){copyText(sentence(),'say')}
  else if(a==='t-scene'){closeModal();go(t.dataset.to)}
  else if(a==='t-demo'){demo();closeModal();go('b3')}
  else if(a==='t-reset'){cancelWater();S=fresh();hint=null;save();closeModal();go('start')}
  else if(a==='t-close'){closeModal()}
});
document.addEventListener('input',e=>{const m=e.target.dataset&&e.target.dataset.model;if(!m)return;setv(m,e.target.value);save();refreshFoot()});
function keepInputs(fn){fn()}
function missA2(){const c=cardOf(S.ind.card),m=[];if(c&&c.id==='idea'&&!S.ind.custom.trim())m.push('내 방법 이름');if(!S.ind.targets.length)m.push('누구의 생명');if(S.ind.act.trim().length<3)m.push('달라지면 좋을 행동');if(!S.ind.reasons.length)m.push('소중한 까닭');return m}
function missB2(){const c=cardOf(S.grp.card),m=[];if(c&&c.id==='idea'&&!S.grp.custom.trim())m.push('방법 이름');if(!S.grp.title.trim())m.push('전시회 이름');if(!S.grp.targets.length)m.push('누구의 생명');if(S.grp.act.trim().length<3)m.push('달라지면 좋을 행동');if(!S.grp.reasons.length&&!S.grp.text.trim())m.push('소중한 까닭');return m}
function footMsg(sc,miss){return miss.length?`아직 <b>${miss.join(', ')}</b>을(를) 정해 주세요.`:(sc==='a2'?'좋아요! 씨앗 카드가 만들어져요.':'계획이 채워졌어요! 이제 모두 함께 점검해 볼까요?')}
function refreshFoot(){ // 글자를 쓰는 동안에는 화면을 다시 그리지 않고(한글 입력 보호) 안내와 단추만 바꿈
  const sc=S.scene;
  if(sc==='r1'){const m=$('#refmsg');if(m)m.textContent=(S.ind.refType&&S.ind.ref1.trim())?'잘 썼어요! 이 화면을 그대로 두고 태블릿을 내려놓아요.':'하나를 고르고 한 문장을 쓰면 선생님께 보여 줄 수 있어요.';return}
  if(sc!=='a2'&&sc!=='b2')return;const miss=sc==='a2'?missA2():missB2();
  const m=$('.foot .msg');if(m)m.innerHTML=footMsg(sc,miss);const b=$('#nextbtn');if(b)b.disabled=!!miss.length;
}
function copyText(t,id){
  const ok=()=>toast('글을 복사했어요. 패들렛에 붙여 넣어요');
  const fb=()=>{try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-999px;top:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);const r=document.execCommand('copy');ta.remove();r?ok():toast('복사가 안 돼요. 글을 길게 눌러 복사해요')}catch(e){toast('복사가 안 돼요. 글을 길게 눌러 복사해요')}};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,fb)}else fb();
}
$('#home').addEventListener('click',()=>{cancelWater();go('start')});
$('#snd').addEventListener('click',()=>{S.sound=!S.sound;save();render();if(S.sound){tone(660,.15,'triangle',.12)}});
/* 교사용 창: 로고 5번 빠르게 누르기 */
let taps=[];$('#logo').addEventListener('click',()=>{const n=Date.now();taps=taps.filter(t=>n-t<2200);taps.push(n);if(taps.length>=5){taps=[];teacher()}});
function closeModal(){const m=$('.modal');if(m)m.remove()}
function teacher(){
  const sc=[['start','시작'],['a1','개인1'],['a2','개인2'],['a3','개인3'],['b0','모둠번호'],['b1','씨앗 심기'],['b2','계획'],['b3','물 주기'],['b4','초대장'],['r1','한 줄 생각']];
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box"><h4>교사용</h4><div class="grid">${sc.map(([k,n])=>`<button class="chip sq" data-act="t-scene" data-to="${k}">${n}</button>`).join('')}</div>
   <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn sm sky" data-act="t-demo" data-sure="예시로 덮어써요? 한 번 더">예시로 채우기</button><button class="btn sm coral" data-act="t-reset" data-sure="모두 지워요? 한 번 더">새로 시작(모두 지우기)</button><button class="btn sm white" data-act="t-close">닫기</button></div>
   <p style="font-size:24px;font-weight:400;margin:14px 0 0;color:#8A6D55">쓴 내용은 이 태블릿의 브라우저에만 저장돼요(밖으로 보내지 않아요). 사생활 보호 모드 등에서는 저장이 안 될 수 있고, 그럴 때는 화면에 알림이 떠요. 새 버전을 처음 열면 연습 기록을 초기화한 뒤 다시 열어 처음 화면인지 확인해요. 학생의 한 줄 생각을 확인하기 전에는 초기화하지 마세요.</p>
   <p style="font-size:23px;font-weight:400;margin:10px 0 0;color:#8A6D55">시간이 부족하면 도덕 점검은 줄이지 말고, 캡처 저장 뒤 패들렛 업로드를 수업 뒤로 미뤄요.</p>
   <label style="display:flex;gap:10px;align-items:center;margin-top:10px;font-size:26px"><input type="checkbox" id="lowc" ${S.low?'checked':''} style="width:26px;height:26px"> 저사양 모드(움직임 줄이기)</label></div>`;
  $('#layer').appendChild(m);
  $('#lowc').addEventListener('change',e=>{S.low=e.target.checked;save();document.body.classList.toggle('low',S.low)});
}
function demo(){cancelWater();hint=null;
  Object.assign(S.ind,{card:'sign',targets:['식물'],reasons:['r1','r2'],act:'화단의 꽃을 꺾지 않고 눈으로 살펴봐요',refType:'',ref1:''});
  Object.assign(S.grp,{no:3,card:'sign',title:'꽃과 함께 사는 전시회',targets:['식물'],act:'화단의 꽃을 꺾지 않고 눈으로 살펴봐요',reasons:['r2','r4'],text:'',help:'꽃이 꺾이지 않고 계속 자랄 수 있어요',fbMode:'keep',fbFix:'',fbKeep:'꽃을 다치게 하지 않는 행동을 알려 주기 때문이에요',with:['가족'],items:['도화지'],place:['복도 게시판'],water:0,q:0,qdone:[false,false,false],sig:'',sigCard:'',scene:'b3'});save();
}
/* 크기 맞추기 */
let kb=false,lastScale=1;
function fit(){if(kb)return;lastScale=Math.min(innerWidth/1280,innerHeight/800);$('#stage').style.transform=`scale(${lastScale})`}
/* 화상 키보드: 입력 중에는 화면 크기를 다시 맞추지 않고, 입력 칸이 보이게 스크롤 */
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('inp')){kb=true;document.body.classList.add('kb');
  setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){ }},300)}});
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('inp')){setTimeout(()=>{if(!document.activeElement||!document.activeElement.classList.contains('inp')){kb=false;document.body.classList.remove('kb');window.scrollTo(0,0);fit()}},150)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229&&e.target.classList&&e.target.classList.contains('inp'))e.target.blur()});
addEventListener('resize',fit);fit();
/* 느린 태블릿이면 저사양 모드로 자동 전환(움직임·번짐 효과 끔) */
(function perf(){
  if(S.low||S.lowChecked)return;let n=0,t0=0,ts=[];
  function f(t){if(t0)ts.push(t-t0);t0=t;if(++n<90)requestAnimationFrame(f);else{ts.sort((a,b)=>a-b);const med=ts[ts.length>>1];S.lowChecked=true;if(med>30){S.low=true;document.body.classList.add('low')}save()}}
  setTimeout(()=>requestAnimationFrame(f),1200);
})();
/* 시작 */
(function init(){
  const h=location.hash.replace('#','');const p=new URLSearchParams(h);
  if(p.get('demo')){demo()}
  if(p.get('water')){const n=+p.get('water');S.grp.qdone=[n>0,n>1,n>2];recalc();S.grp.q=Math.min(2,n);S.grp.sig=sigOf();S.grp.sigCard=methodOf()}
  const sc=p.get('scene');
  if(sc&&SCENES[sc]){S.scene=sc}
  else if(!SCENES[S.scene])S.scene='start';
  sanitize();
  render();
})();
window.__app={S:()=>S,go,SCENES,doWater};
window.__art={sprout,plantSVG,garden,ic,CARDS};
</script>
